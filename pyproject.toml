[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cipherscope"
version = "0.1.0"
description = "Research-grade source-aware tracing for OpenFHE Python CKKS programs"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "CipherScope contributors"}]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security :: Cryptography",
]
dependencies = []

[project.scripts]
cipherscope = "cipherscope.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/cipherscope/schemas" = ["schemas/*.schema.json"]
